<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eva cumple 9 · Invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;600;700&display=swap">
<style>
  :root {
    --red: #e3241b;
    --red-deep: #9c1010;
    --red-light: #ff5a3c;
    --blue: #1b6fd1;
    --gold: #ffcf2e;
    --white: #ffffff;
    --shadow: #7a0a0a;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--red-deep); }
  body {
    font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
    color: var(--white);
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Fondo animado ---------- */
  .bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 45%, #ff5a3c 0%, #e3241b 50%, #a51212 100%);
  }
  .blob { position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%; will-change: transform; }
  .b1 { left: -30vmax; top: -30vmax; background: radial-gradient(circle, rgba(255,196,60,.6), transparent 65%); animation: drift1 11s ease-in-out infinite alternate; }
  .b2 { right: -35vmax; bottom: -35vmax; background: radial-gradient(circle, rgba(255,110,150,.5), transparent 65%); animation: drift2 13s ease-in-out infinite alternate; }
  .b3 { left: -10vmax; bottom: -40vmax; background: radial-gradient(circle, rgba(60,150,255,.38), transparent 65%); animation: drift3 15s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate3d(45vmax, 35vmax, 0) scale(1.15); } }
  @keyframes drift2 { to { transform: translate3d(-45vmax, -30vmax, 0) scale(1.1); } }
  @keyframes drift3 { to { transform: translate3d(50vmax, -25vmax, 0) scale(1.2); } }
  .rays, .rays2 {
    position: absolute; left: 50%; top: 50%;
    width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; will-change: transform;
    -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.25) 35%, transparent 62%);
            mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.25) 35%, transparent 62%);
  }
  .rays  { background: repeating-conic-gradient(from 0deg, rgba(255,214,64,.30) 0deg 7deg, transparent 7deg 20deg); animation: spin 70s linear infinite; }
  .rays2 { background: repeating-conic-gradient(from 10deg, rgba(255,255,255,.18) 0deg 4deg, transparent 4deg 30deg); animation: spin 110s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sweep {
    position: absolute; inset: 0;
    inset: -10% auto -10% -70%; width: 60%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.26) 40%, rgba(255,255,255,.26) 60%, transparent);
    transform: skewX(-22deg); will-change: transform;
    animation: sweep 6.5s linear infinite;
  }
  @keyframes sweep { from { transform: translateX(0) skewX(-22deg); } to { transform: translateX(340%) skewX(-22deg); } }
  .spark {
    position: absolute; width: 14px; height: 14px; background: #fff;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    opacity: 0; animation: twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: .95; transform: scale(1.2) rotate(90deg); } }

  .sky { position: fixed; inset: 0; z-index: 1; overflow: hidden; }
  .balloon { position: absolute; top: 0; cursor: pointer; touch-action: none; will-change: transform; }
  .balloon svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }

  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 2; pointer-events: none; }

  /* ---------- Pantalla 2 ---------- */
  .stage {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: calc(max(1.6vh, env(safe-area-inset-top)) + 4px) 5vw max(2vh, env(safe-area-inset-bottom));
    pointer-events: none; text-align: center;
  }
  .top, .bottom { width: 100%; max-width: 520px; }
  .l1 {
    font-weight: 700; font-size: clamp(16px, 4.6vw, 28px); line-height: 1.15; padding: 0 34px;
    text-shadow: 0 3px 0 var(--shadow), 0 8px 14px rgba(0,0,0,.3);
  }
  .date {
    font-family: 'Luckiest Guy', 'Impact', sans-serif;
    font-size: clamp(40px, 13.4vw, 80px); line-height: 1; letter-spacing: .02em; white-space: nowrap;
    text-shadow: 0 4px 0 var(--shadow), 0 9px 0 rgba(122,10,10,.5), 0 16px 22px rgba(0,0,0,.35);
  }
  .month {
    font-family: 'Luckiest Guy', 'Impact', sans-serif;
    font-size: clamp(28px, 9vw, 54px); line-height: 1.05; letter-spacing: .04em; color: var(--gold);
    text-shadow: 0 4px 0 #8a5a00, 0 9px 16px rgba(0,0,0,.35);
  }
  .mid { position: relative; flex: 1; width: 100%; max-width: 520px; min-height: 30vh; }
  .bottom { display: grid; gap: 1vh; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; justify-content: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px; border-radius: 999px;
    background: rgba(255,255,255,.97); color: var(--red-deep);
    font-weight: 700; font-size: clamp(13px, 3.9vw, 20px); text-decoration: none; white-space: nowrap;
    box-shadow: 0 5px 0 rgba(122,10,10,.6), 0 12px 20px rgba(0,0,0,.25);
  }
  .chip svg { width: 1.1em; height: 1.1em; flex: none; }
  a.chip { pointer-events: auto; cursor: pointer; }
  a.chip:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(122,10,10,.6); }
  a.chip:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
  .bye {
    font-family: 'Luckiest Guy', 'Impact', sans-serif;
    font-size: clamp(30px, 9.6vw, 52px); line-height: 1.05; letter-spacing: .05em; color: var(--white);
    text-shadow: 0 4px 0 var(--blue), 0 9px 16px rgba(0,0,0,.35);
  }
  .ch { display: inline-block; will-change: transform; }
  .wd { display: inline-block; will-change: transform; white-space: pre; }

  /* ---------- Pantalla 1 ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh;
    text-align: center; padding: 24px;
  }
  .intro .pre {
    font-family: 'Luckiest Guy', 'Impact', sans-serif;
    font-size: clamp(30px, 10vw, 58px); letter-spacing: .04em;
    text-shadow: 0 4px 0 var(--shadow), 0 9px 16px rgba(0,0,0,.3);
  }
  .intro .who {
    font-family: 'Luckiest Guy', 'Impact', sans-serif;
    font-size: clamp(96px, 34vw, 190px); line-height: .9; letter-spacing: .04em; color: var(--gold);
    text-shadow: 0 6px 0 #8a5a00, 0 13px 0 rgba(122,10,10,.5), 0 22px 28px rgba(0,0,0,.4);
  }
  .intro .sub { font-weight: 700; font-size: clamp(18px, 5.4vw, 28px); text-shadow: 0 3px 0 var(--shadow); }
  .open {
    pointer-events: auto; cursor: pointer; margin-top: 1vh;
    font-family: 'Luckiest Guy', 'Impact', sans-serif; font-size: clamp(26px, 8vw, 38px); letter-spacing: .06em;
    padding: 16px 44px; border: 0; border-radius: 999px;
    background: var(--gold); color: #6d1200;
    box-shadow: 0 7px 0 #b07a00, 0 16px 26px rgba(0,0,0,.3);
    animation: pulse 1.3s ease-in-out infinite;
  }
  .open:active { transform: translateY(5px); box-shadow: 0 2px 0 #b07a00; animation: none; }
  .open:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
  @keyframes pulse { 50% { transform: scale(1.08); } }

  .hint {
    position: absolute; left: 0; right: 0; top: 0; text-align: center; pointer-events: none;
    font-size: 14px; font-weight: 600; opacity: 0;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .mute {
    position: fixed; z-index: 20; right: 8px; top: max(8px, env(safe-area-inset-top));
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.95); color: var(--red-deep);
    box-shadow: 0 4px 0 rgba(122,10,10,.6), 0 8px 14px rgba(0,0,0,.25);
    display: grid; place-items: center;
  }
  .mute svg { width: 22px; height: 22px; }
  .mute:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
  .mute .off { display: none; }
  .mute.is-off .on { display: none; }
  .mute.is-off .off { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .blob, .rays, .rays2, .sweep, .spark, .open { animation: none; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="rays"></div><div class="rays2"></div><div class="sweep"></div>
  <div id="sparks"></div>
</div>
<div class="sky" id="sky" aria-hidden="true"></div>
<canvas id="gl" aria-hidden="true"></canvas>

<main class="stage" id="stage">
  <section class="top">
    <div class="l1" id="l1">Te invito a festejar el día</div>
    <div class="date" id="date">Viernes 30</div>
    <div class="month" id="month">de Octubre</div>
  </section>

  <section class="mid" id="mid"><div class="hint" id="hint">Tocá los globos, el escudo y la pantalla</div></section>

  <section class="bottom">
    <div class="chips">
      <span class="chip" id="chipTime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        18 a 20:30 hs
      </span>
      <a class="chip" id="chipPlace" href="https://www.google.com/maps/search/?api=1&query=Tronador%2041%2C%20Buenos%20Aires%2C%20Argentina" target="_blank" rel="noopener" aria-label="Abrir Tronador 41 en Google Maps">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        Tronador 41
      </a>
    </div>
    <div class="bye" id="bye">¡Te espero!</div>
  </section>
</main>


<div class="intro" id="intro">
  <div class="pre" id="pre">Mi cumple Nº 9</div>
  <div class="who" id="who">Eva</div>
  <div class="sub" id="sub">Tenés una invitación</div>
  <button class="open" id="openBtn">ABRIR</button>
</div>

<button class="mute" id="mute" aria-label="Silenciar sonidos" title="Sonido">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.500 8.500 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

    seq(tl, subW, { y: 40, opacity: 0, scale: .6 }, { y: 0, opacity: 1, scale: 1, duration: .6, ease: 'back.out(2.4)' }, .14, '-=.5');
    tl.fromTo(openBtn, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .7, ease: 'elastic.out(1,.5)' }, '-=.3');
    if (!reduce) tl.add(() => gsap.to(whoC, { y: -10, duration: .9, ease: 'sine.inOut', yoyo: true, repeat: -1, stagger: { each: .15, yoyo: true, repeat: -1 } }));
  })();

  function open() {
    if (opened) return;
    opened = true; unlockAudio();
    if (AC && AC.state !== 'running') AC.resume().then(() => sfx.fanfare(), () => sfx.fanfare()); else sfx.fanfare();
    gsap.killTweensOf(whoC);
    const tl = gsap.timeline();
    tl.to('#intro', { opacity: 0, scale: 1.2, duration: .55, ease: 'power2.in', onComplete: () => document.getElementById('intro').remove() });
    tl.add(() => burst(0, 0, 160, 4), 0.05);

    // Pantalla 2
    tl.add(() => sfx.whoosh(), '-=.1');
    seq(tl, l1W, i => ({ x: i % 2 ? 140 : -140, opacity: 0, rotation: i % 2 ? 10 : -10 }), { x: 0, opacity: 1, rotation: 0, duration: .6, ease: 'back.out(1.8)' }, .1, '>', i => sfx.blip(i));
    seq(tl, dateC, { y: 110, opacity: 0, rotationX: -90, transformOrigin: '50% 100%' }, { y: 0, opacity: 1, rotationX: 0, duration: .6, ease: 'back.out(2)' }, .06, '-=.15', i => sfx.blip(i + 1));
    seq(tl, monthW, { scale: 0, opacity: 0, rotation: -15 }, { scale: 1, opacity: 1, rotation: 0, duration: .7, ease: 'elastic.out(1,.5)' }, .2, '-=.1', () => sfx.boing());

    // Escudo entra girando
    tl.add(() => { sfx.whoosh(); sfx.sparkle(6); });
    tl.fromTo(crest.userData, { s: 0 }, { s: 1, duration: 1.3, ease: 'elastic.out(1,.55)' }, '<');
    tl.fromTo(cs, { angle: -TAU * 4 }, { angle: 0, duration: 1.6, ease: 'power3.out', onComplete: () => { cs.auto = true; } }, '<');
    tl.fromTo(stars.scale, { x: 0, y: 0, z: 0 }, { x: 1, y: 1, z: 1, duration: .9, ease: 'back.out(2.5)' }, '-=1');
    tl.fromTo(ns, { s: 0 }, { s: 1, duration: .9, ease: 'elastic.out(1,.5)', onStart: () => sfx.boing() }, '-=.6');
    tl.add(() => burst(0, rig.position.y, 120, 3.6), '<');

    // Datos
    seq(tl, chips, { y: 80, opacity: 0, scale: .4 }, { y: 0, opacity: 1, scale: 1, duration: .7, ease: 'elastic.out(1,.55)' }, .18, '-=.3', () => sfx.ding());
    seq(tl, byeC, { y: 50, opacity: 0, scale: 0 }, { y: 0, opacity: 1, scale: 1, duration: .5, ease: 'back.out(3)' }, .05, '-=.1', i => { if (i % 2 === 0) sfx.blip(i / 2); });
    tl.add(() => { sfx.party(); burst(0, -worldH * .3, 140, 3.6); });

    tl.add(() => {
      cycle();
      gsap.to('#hint', { opacity: .95, duration: .6 });
      gsap.to('#hint', { opacity: 0, duration: .8, delay: 6 });
      if (reduce) return;
      gsap.to(byeC, { y: -10, duration: .6, ease: 'sine.inOut', yoyo: true, repeat: -1, stagger: { each: .07, yoyo: true, repeat: -1 } });
      gsap.to(chips, { y: -5, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1, stagger: .25 });
      gsap.to(dateC, { y: -6, duration: .8, ease: 'sine.inOut', yoyo: true, repeat: -1, stagger: { each: .08, yoyo: true, repeat: -1 } });
    });
  }
  openBtn.addEventListener('click', open);
  document.getElementById('chipPlace').addEventListener('pointerdown', () => sfx.ding());
})();
</script>
</body>
</html>
